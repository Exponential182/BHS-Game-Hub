{% extends "layout.html" %}
{% block style %}
<link rel="stylesheet" href="{{url_for('static', filename='css/game.css')}}">
{% endblock%}
{% block content %}
<div class="game-page-flex game-page-flex-small">
    <div class="game-page-primary-column">
        {% if game_data.has_html %}
        <iframe class="game-page-web-game" src="{{game_data.html_file_path}}" frameborder="0"></iframe>
        {% endif %}
        {{game_data.description}}
        <p class="game-description">
            {{game_data.description}}
        </p>
    </div>
</div>

{% endblock %}
